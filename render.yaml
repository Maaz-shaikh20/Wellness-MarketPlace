services:
  # ----------------------------------------------------
  # Frontend Service (Static Site - Free & Fast)
  # ----------------------------------------------------
  - type: static
    name: wellness-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    publishPath: dist
    headers:
      - path: /*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: ${wellness-backend}/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 1018119376139-531vjcsj2eskmukf5prsv4iq4kg2r1eg.apps.googleusercontent.com

  # ----------------------------------------------------
  # Backend Service (Docker Web Service)
  # ----------------------------------------------------
  - type: web
    name: wellness-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile # FIX: must be relative to dockerContext (backend/)
    plan: free
    envVars:
      # Database connection environment variables
      # Configured for native Render PostgreSQL database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: DB_HOST
        fromDatabase:
          name: wellness-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wellness-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: wellness-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: wellness-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: wellness-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-Djava.net.preferIPv4Stack=true"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: GOOGLE_CLIENT_ID
        value: 1018119376139-531vjcsj2eskmukf5prsv4iq4kg2r1eg.apps.googleusercontent.com

databases:
  - name: wellness-db
    databaseName: wellness_db
    user: postgres
    plan: free



