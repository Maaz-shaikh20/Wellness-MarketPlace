spring.application.name=wellness-backend

# =========================
# Server configuration
# =========================
server.port=8080

# =========================
# Database Configuration (Clever Cloud MySQL - max 5 connections)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wellness_marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Maaz@12345}

# Clever Cloud free plan allows max 5 simultaneous connections.
# Pool of 2 + 1 idle leaves headroom for Hibernate and other overhead.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# =========================
# JPA / Hibernate
# =========================
# IMPORTANT: Set to "none" – schema already exists on Clever Cloud.
# "update" opens an extra isolated DDL connection at startup which pushes
# the total connections over the free-plan limit of 5.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable SQL logging in production to reduce log noise
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT Secret
# =========================
jwt.secret=GFqX6re3cM5KdDzA4+S9XK6WC1zhNQ2snCC7WbEjcucixSC3UZq+qZG/HCeYMnMyRV/SJDW/lQlVJJHubz1Aiw==
jwt.expiration=3600000

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN