spring.application.name=wellness-backend

# =========================
# Server configuration
# =========================
server.port=8080

# Database Configuration (PostgreSQL)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wellness_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Connection pool settings for PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable SQL logging in production to reduce log noise
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT Secret
# =========================
jwt.secret=${JWT_SECRET:GFqX6re3cM5KdDzA4+S9XK6WC1zhNQ2snCC7WbEjcucixSC3UZq+qZG/HCeYMnMyRV/SJDW/lQlVJJHubz1Aiw==}
jwt.expiration=3600000

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# =========================
# Mail Configuration (SMTP)
# =========================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Resend API Configuration
# =========================
resend.api.key=${RESEND_API_KEY:}

# =========================
# Gmail REST API Configuration
# =========================
gmail.client.id=${GMAIL_CLIENT_ID:}
gmail.client.secret=${GMAIL_CLIENT_SECRET:}
gmail.refresh.token=${GMAIL_REFRESH_TOKEN:}
gmail.sender.email=${GMAIL_SENDER_EMAIL:wellnestmarketplace01@gmail.com}

# =========================
# Application Properties
# =========================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# =========================
# Google OAuth2 (Sign-In)
