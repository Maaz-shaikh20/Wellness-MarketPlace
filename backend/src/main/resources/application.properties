spring.application.name=wellness-backend

# =========================
# Server configuration
# =========================
server.port=8080

# Database Configuration (PostgreSQL)
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wellness_marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Maaz@12345}

# Connection pool settings for PostgreSQL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable SQL logging in production to reduce log noise
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# JWT Secret
# =========================
jwt.secret=GFqX6re3cM5KdDzA4+S9XK6WC1zhNQ2snCC7WbEjcucixSC3UZq+qZG/HCeYMnMyRV/SJDW/lQlVJJHubz1Aiw==
jwt.expiration=3600000

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN