spring.application.name=wellness-backend

# =========================
# Server configuration
# =========================
server.port=8080

# =========================
# Database Configuration
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/wellness_marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Maaz@12345}

# =========================
# JPA / Hibernate
# =========================
# Recommended: create-drop only for first-time testing or create for initial setup
# After DB is ready, set to update
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}



# Show SQL queries in console (debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT Secret
# =========================
jwt.secret=GFqX6re3cM5KdDzA4+S9XK6WC1zhNQ2snCC7WbEjcucixSC3UZq+qZG/HCeYMnMyRV/SJDW/lQlVJJHubz1Aiw==
jwt.expiration=3600000

# =========================
# Logging
# =========================
logging.level.org.springframework.security=INFO
